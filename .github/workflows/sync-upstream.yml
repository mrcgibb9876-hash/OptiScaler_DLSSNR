name: Sync upstream DLSS Neural Rendering

# PR-ONLY mode.
#
# This workflow keeps the mirror branch (dlss-neural-rendering) current with Dagherbou's upstream
# and then OFFERS the new upstream commits to the default branch as a pull request. It never
# merges into, and never pushes to, dlss5-developer-controls-ui. Upstream changes reach the engine
# only when the maintainer has built and tested the PR branch and merges the PR by hand.
#
# What a run does when upstream has commits the default branch does not:
#   1. fast-forwards the mirror branch to upstream and pushes it (the mirror is not a release branch)
#   2. builds a branch upstream-sync/<date> = default branch + merge of upstream
#      (an already-open upstream-sync PR is reused and its branch refreshed instead)
#   3. opens or updates the PR "Upstream update: N new commits from Dagherbou" with the commit list
#      and the test checklist
#   4. dispatches just_build_no_signature.yml on that branch so a test build is waiting
# On a merge conflict it still opens the PR (branch = upstream tip) and says so; no build.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      reset_mirror:
        description: >-
          Discard anything committed onto the mirror branch and make it match upstream exactly.
          Only needed once, after someone has committed to the mirror by mistake.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/Dagherbou/OptiScaler_DLSSNR.git
  UPSTREAM_REPO: Dagherbou/OptiScaler_DLSSNR
  UPSTREAM_BRANCH: dlss-neural-rendering
  MIRROR_BRANCH: dlss-neural-rendering
  UI_BRANCH: dlss5-developer-controls-ui
  SYNC_PREFIX: upstream-sync/
  BUILD_WORKFLOW: just_build_no_signature.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT with the "workflow" scope lets the pushes below carry upstream changes to
          # .github/workflows; GITHUB_TOKEN is refused for those. Optional.
          token: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch every branch from origin and upstream
        run: |
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

      # The mirror is meant to be a copy of upstream and nothing else. Commit onto it and the
      # scheduled fast-forward below stops working the moment upstream next moves: the branch is
      # then both ahead and behind, which is not a fast-forward.
      #
      # Recovering from that is a force-push, which is exactly the operation you do not want running
      # on a schedule -- so it is opt-in, and it prints what it is about to throw away first.
      - name: Reset the mirror to upstream (only when asked)
        if: inputs.reset_mirror
        env:
          GIT_TOKEN: ${{ secrets.MIRROR_RESET_TOKEN || github.token }}
        run: |
          git remote set-url origin "https://x-access-token:$GIT_TOKEN@github.com/${{ github.repository }}.git"
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"

          EXTRA=$(git log --oneline "upstream/$UPSTREAM_BRANCH..HEAD")

          if [ -z "$EXTRA" ]; then
            echo "The mirror has nothing upstream does not. Nothing to reset."
            exit 0
          fi

          echo "About to discard these commits from $MIRROR_BRANCH:"
          echo "$EXTRA"
          echo
          echo "They stay reachable from the reflog and from any branch that already contains them."

          git reset --hard "upstream/$UPSTREAM_BRANCH"

          # Needs a token with the "workflow" scope whenever the reset touches .github/workflows.
          # Set MIRROR_RESET_TOKEN to such a PAT, or do it by hand:
          #   git push origin +upstream/dlss-neural-rendering:refs/heads/dlss-neural-rendering
          git push --force-with-lease origin "$MIRROR_BRANCH"

          echo "$MIRROR_BRANCH now matches upstream at $(git rev-parse --short HEAD)."

      - name: Fast-forward the mirror branch to upstream
        id: ff
        run: |
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"

          BEFORE=$(git rev-parse HEAD)

          if git merge --ff-only "upstream/$UPSTREAM_BRANCH"; then
            :
          else
            echo "::warning::The mirror has commits upstream does not, so this could not fast-forward. Merging instead. Dispatch this workflow with reset_mirror to make it a clean mirror again."
            git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          fi

          AFTER=$(git rev-parse HEAD)
          echo "changed=$([ "$BEFORE" != "$AFTER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Only the mirror is pushed here. The default branch is never pushed by this workflow.
      - name: Push refreshed mirror branch
        if: steps.ff.outputs.changed == 'true'
        run: |
          if ! git push origin "$MIRROR_BRANCH"; then
            echo "::warning::Could not push the mirror (upstream probably changed .github/workflows and the token lacks the workflow scope). Continuing: the PR below is built from upstream directly."
          fi

      # Compare UPSTREAM (not the mirror) against the default branch: the mirror carries two
      # commits of its own that were deliberately never merged, and they are not upstream news.
      - name: Work out what upstream has that the default branch does not
        id: diff
        run: |
          UP="upstream/$UPSTREAM_BRANCH"
          COUNT=$(git rev-list --count --no-merges "origin/$UI_BRANCH..$UP")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse "$UP")" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "Default branch already contains everything upstream has. Nothing to offer."
            exit 0
          fi

          {
            git log --no-merges --format="- [\`%h\`](https://github.com/$UPSTREAM_REPO/commit/%H) %s (%an, %ad)" \
              --date=short -n 100 "origin/$UI_BRANCH..$UP"
            if [ "$COUNT" -gt 100 ]; then echo "- ...and $((COUNT - 100)) more"; fi
          } > "$RUNNER_TEMP/commits.md"
          cat "$RUNNER_TEMP/commits.md"

      - name: Build the upstream-sync branch
        id: branch
        if: steps.diff.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the branch of an already-open upstream-sync PR so there is only ever one.
          EXISTING=$(gh pr list --base "$UI_BRANCH" --state open --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"$SYNC_PREFIX\"))][0] | if . then \"\(.number) \(.headRefName)\" else \"\" end")

          if [ -n "$EXISTING" ]; then
            PR_NUMBER=${EXISTING%% *}
            BRANCH=${EXISTING#* }
          else
            PR_NUMBER=""
            BRANCH="${SYNC_PREFIX}$(date -u +%Y-%m-%d)"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Nothing new since the last run: the existing branch already holds this default-branch
          # tip and this upstream tip. Leave it (and the build already made from it) alone.
          if git rev-parse -q --verify "origin/$BRANCH" >/dev/null \
             && git merge-base --is-ancestor "origin/$UI_BRANCH" "origin/$BRANCH" \
             && git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" "origin/$BRANCH"; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "$BRANCH is already up to date."
            exit 0
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

          git checkout -B "$BRANCH" "origin/$UI_BRANCH"
          if git merge --no-edit -m "Merge upstream $UPSTREAM_REPO:$UPSTREAM_BRANCH for testing" "upstream/$UPSTREAM_BRANCH"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            # The PR then comes straight from upstream's tip; GitHub marks it conflicting and it is
            # resolved by hand (merge dlss5-developer-controls-ui into it locally).
            git checkout -B "$BRANCH" "upstream/$UPSTREAM_BRANCH"
          fi

          # This is our own bot branch, so replacing it is fine. It is never the default branch.
          if ! git push --force origin "HEAD:refs/heads/$BRANCH"; then
            echo "::error::Could not push $BRANCH. If upstream changed .github/workflows, GITHUB_TOKEN is not allowed to push that: add a SYNC_PUSH_TOKEN secret (PAT with repo + workflow scopes) or push the branch by hand."
            exit 1
          fi

      - name: Open or update the pull request
        if: steps.diff.outputs.count != '0' && steps.branch.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.diff.outputs.count }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PR_NUMBER: ${{ steps.branch.outputs.pr }}
          CONFLICT: ${{ steps.branch.outputs.conflict }}
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
        run: |
          TITLE="Upstream update: $COUNT new commits from Dagherbou"
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "Automatic upstream offer from \`$UPSTREAM_REPO:$UPSTREAM_BRANCH\` (at \`${UPSTREAM_SHA:0:8}\`)."
            echo "**Nothing has been merged.** This PR only proposes the new upstream commits; merge it by hand after testing."
            echo
            if [ "$CONFLICT" = "true" ]; then
              echo "> [!WARNING]"
              echo "> **Merge conflict.** Upstream does not merge cleanly into \`$UI_BRANCH\`, so this branch is upstream's tip and no build was started."
              echo "> Resolve locally: \`git fetch origin && git checkout $BRANCH && git merge origin/$UI_BRANCH\`, fix, push, then run the checklist."
              echo ">"
              echo "> Conflicting files:"
              sed 's/^/> - `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
              echo
            else
              echo "Branch \`$BRANCH\` = \`$UI_BRANCH\` + merge of upstream. A **Build (No Signing)** run was dispatched on it: [Actions](https://github.com/${{ github.repository }}/actions/workflows/$BUILD_WORKFLOW?query=branch%3A$(printf %s "$BRANCH" | sed 's#/#%2F#g'))."
              echo
            fi
            echo "### New upstream commits ($COUNT)"
            cat "$RUNNER_TEMP/commits.md"
            echo
            echo "### Before merging"
            echo "- [ ] Build: run **Build (No Signing)** (\`$BUILD_WORKFLOW\`) on \`$BRANCH\` and grab the artifact"
            echo "- [ ] Test Cyberpunk 2077 with frame generation on (DLSS 5 + FG, watch for the TDR / VRAM crash)"
            echo "- [ ] Test Dawnwalker with RenoDX (HDR page on the panel, host API)"
            echo "- [ ] Test a Vulkan game (e.g. DOOM: The Dark Ages)"
            echo "- [ ] Then merge this PR into \`$UI_BRANCH\` by hand"
            echo
            echo "_Opened by the sync-upstream workflow (PR-only mode). It never pushes to \`$UI_BRANCH\`._"
          } > "$BODY"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$BODY"
            gh pr comment "$PR_NUMBER" --body "Refreshed: upstream is now at \`${UPSTREAM_SHA:0:8}\` ($COUNT new commits in total)."
          else
            gh pr create --base "$UI_BRANCH" --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
          fi

      - name: Dispatch a test build on the branch
        if: steps.diff.outputs.count != '0' && steps.branch.outputs.unchanged != 'true' && steps.branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: gh workflow run "$BUILD_WORKFLOW" --ref "$BRANCH"
