
name: Sync upstream DLSS Neural Rendering

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      reset_mirror:
        description: >-
          Discard anything committed onto the mirror branch and make it match upstream exactly.
          Only needed once, after someone has committed to the mirror by mistake.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/Dagherbou/OptiScaler_DLSSNR.git
  UPSTREAM_BRANCH: dlss-neural-rendering
  MIRROR_BRANCH: dlss-neural-rendering
  UI_BRANCH: dlss5-developer-controls-ui

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch every branch from origin and upstream
        run: |
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

      # The mirror is meant to be a copy of upstream and nothing else. Commit onto it and the
      # scheduled fast-forward below stops working the moment upstream next moves: the branch is
      # then both ahead and behind, which is not a fast-forward, and the sync fails every night
      # until someone intervenes.
      #
      # Recovering from that is a force-push, which is exactly the operation you do not want running
      # on a schedule -- so it is opt-in, and it prints what it is about to throw away first.
      - name: Reset the mirror to upstream (only when asked)
        if: inputs.reset_mirror
        env:
          GIT_TOKEN: ${{ secrets.MIRROR_RESET_TOKEN || github.token }}
        run: |
          git remote set-url origin "https://x-access-token:$GIT_TOKEN@github.com/${{ github.repository }}.git"
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"

          EXTRA=$(git log --oneline "upstream/$UPSTREAM_BRANCH..HEAD")

          if [ -z "$EXTRA" ]; then
            echo "The mirror has nothing upstream does not. Nothing to reset."
            exit 0
          fi

          echo "About to discard these commits from $MIRROR_BRANCH:"
          echo "$EXTRA"
          echo
          echo "They stay reachable from the reflog and from any branch that already contains them."

          git reset --hard "upstream/$UPSTREAM_BRANCH"

          # This push needs a token with the "workflow" scope whenever the reset adds, removes or
          # changes anything under .github/workflows -- and it does, because the extra commits on
          # the mirror are the ones that put the workflows there. GITHUB_TOKEN cannot do it and the
          # push comes back "refusing to allow a GitHub App to create or update workflow".
          #
          # Set MIRROR_RESET_TOKEN to a PAT with that scope to use this, or do it by hand over SSH:
          #   git push origin +upstream/dlss-neural-rendering:refs/heads/dlss-neural-rendering
          git push --force-with-lease origin "$MIRROR_BRANCH"

          echo "$MIRROR_BRANCH now matches upstream at $(git rev-parse --short HEAD)."

      - name: Fast-forward the mirror branch to upstream
        id: ff
        run: |
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"

          BEFORE=$(git rev-parse HEAD)

          # Fast-forward is the shape this is supposed to have, and while it works the mirror stays
          # byte-identical to upstream. But it stops being possible the moment the mirror has any
          # commit of its own AND upstream moves, and then this job fails every night for a reason
          # that has nothing to do with the sync itself.
          #
          # Falling back to a merge keeps the mirror current, which is all the downstream merge into
          # the UI branch actually needs. It is not as tidy, and the run says so.
          if git merge --ff-only "upstream/$UPSTREAM_BRANCH"; then
            :
          else
            echo "::warning::The mirror has commits upstream does not, so this could not fast-forward. Merging instead. Dispatch this workflow with reset_mirror to make it a clean mirror again."
            git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          fi

          AFTER=$(git rev-parse HEAD)

          echo "changed=$([ "$BEFORE" != "$AFTER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Upstream has nothing new -- already at $BEFORE."
          fi

      - name: Push refreshed mirror branch
        if: steps.ff.outputs.changed == 'true'
        run: git push origin "$MIRROR_BRANCH"

      - name: Merge refreshed mirror into your UI branch
        id: merge
        if: steps.ff.outputs.changed == 'true'
        run: |
          git checkout -B "$UI_BRANCH" "origin/$UI_BRANCH"
          git merge "$MIRROR_BRANCH" --no-edit

      - name: Push UI branch (clean merge)
        if: steps.ff.outputs.changed == 'true'
        run: git push origin "$UI_BRANCH"

      - name: On merge conflict, open a PR for manual resolution
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          git merge --abort 2>/dev/null || true

          CONFLICT_BRANCH="upstream-sync-conflict-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$CONFLICT_BRANCH" "$MIRROR_BRANCH"
          git push origin "$CONFLICT_BRANCH"

          gh pr create \
            --base "$UI_BRANCH" \
            --head "$CONFLICT_BRANCH" \
            --title "Upstream sync needs manual merge into $UI_BRANCH" \
            --body "Auto-sync pulled new commits but merging into ${UI_BRANCH} did not apply cleanly. Resolve the conflicts in this PR by hand."
        env:
          GH_TOKEN: ${{ github.token }}
