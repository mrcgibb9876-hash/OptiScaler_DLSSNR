name: Sync upstream DLSS Neural Rendering

# Upstream cannot change this fork on its own. That is the whole point of this file.
#
# It used to run at 06:00 every day and, whenever upstream had moved, merge the refreshed mirror
# straight into the branch every engine release is cut from and push it. Nobody asked for that
# merge, nobody read it, and it would have arrived while the release pin in the manager's
# package.json still named a tag built from the branch as it was the night before.
#
# It never actually fired, and only by luck: Dagherbou's dlss-neural-rendering has not moved since
# our mirror caught up to it, so the merge was a no-op every night. The first upstream commit would
# have ended that -- and not with one commit either. The mirror carries 144 commits this branch has
# never had (it forked at 4f17a05d, before the DLSS-NR work landed upstream, and the fork
# re-implemented that work its own way), so the first scheduled run after any upstream push would
# have merged all 144 of them plus whatever was new, unreviewed, onto the default branch.
#
# So: no schedule. Upstream is fetched when someone asks for it, the mirror branch is where it
# lands, and the only way it reaches dlss5-developer-controls-ui is a pull request a person reads
# and merges. Taking upstream work is a decision, not a cron job.

on:
  workflow_dispatch:
    inputs:
      reset_mirror:
        description: >-
          Discard anything committed onto the mirror branch and make it match upstream exactly.
          Only needed once, after someone has committed to the mirror by mistake.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/Dagherbou/OptiScaler_DLSSNR.git
  UPSTREAM_BRANCH: dlss-neural-rendering
  MIRROR_BRANCH: dlss-neural-rendering
  UI_BRANCH: dlss5-developer-controls-ui

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch every branch from origin and upstream
        run: |
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

      # The mirror is meant to be a copy of upstream and nothing else. Commit onto it and the
      # fast-forward below stops working the moment upstream next moves: the branch is then both
      # ahead and behind, which is not a fast-forward.
      #
      # Recovering from that is a force-push, so it stays opt-in, and it prints what it is about to
      # throw away first.
      - name: Reset the mirror to upstream (only when asked)
        if: inputs.reset_mirror
        env:
          GIT_TOKEN: ${{ secrets.MIRROR_RESET_TOKEN || github.token }}
        run: |
          git remote set-url origin "https://x-access-token:$GIT_TOKEN@github.com/${{ github.repository }}.git"
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"

          EXTRA=$(git log --oneline "upstream/$UPSTREAM_BRANCH..HEAD")

          if [ -z "$EXTRA" ]; then
            echo "The mirror has nothing upstream does not. Nothing to reset."
            exit 0
          fi

          echo "About to discard these commits from $MIRROR_BRANCH:"
          echo "$EXTRA"
          echo
          echo "They stay reachable from the reflog and from any branch that already contains them."

          git reset --hard "upstream/$UPSTREAM_BRANCH"

          # This push needs a token with the "workflow" scope whenever the reset adds, removes or
          # changes anything under .github/workflows -- and it does, because the extra commits on
          # the mirror are the ones that put the workflows there. GITHUB_TOKEN cannot do it and the
          # push comes back "refusing to allow a GitHub App to create or update workflow".
          #
          # Set MIRROR_RESET_TOKEN to a PAT with that scope to use this, or do it by hand over SSH:
          #   git push origin +upstream/dlss-neural-rendering:refs/heads/dlss-neural-rendering
          git push --force-with-lease origin "$MIRROR_BRANCH"

          echo "$MIRROR_BRANCH now matches upstream at $(git rev-parse --short HEAD)."

      - name: Fast-forward the mirror branch to upstream
        id: ff
        run: |
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"

          BEFORE=$(git rev-parse HEAD)

          # While this works the mirror stays byte-identical to upstream. It stops being possible
          # the moment the mirror has a commit of its own AND upstream moves; a merge keeps the
          # mirror current, which is all the pull request below needs. The run says which happened.
          if git merge --ff-only "upstream/$UPSTREAM_BRANCH"; then
            :
          else
            echo "::warning::The mirror has commits upstream does not, so this could not fast-forward. Merging instead. Dispatch this workflow with reset_mirror to make it a clean mirror again."
            git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          fi

          AFTER=$(git rev-parse HEAD)

          echo "changed=$([ "$BEFORE" != "$AFTER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Upstream has nothing new -- already at $BEFORE."
          fi

      # Only the mirror branch is written. If upstream touched anything under .github/workflows this
      # push fails, because GITHUB_TOKEN may not write workflow files -- which is the right failure:
      # it stops, loudly, instead of changing this fork.
      - name: Push refreshed mirror branch
        if: steps.ff.outputs.changed == 'true'
        run: git push origin "$MIRROR_BRANCH"

      # The mirror never merges itself into the UI branch. It asks.
      #
      # Whether it applies cleanly is not the question -- a clean merge of work nobody read is the
      # thing this fork is being kept safe from. So it is always a pull request, and the diff is
      # against a branch that has diverged from the mirror by design: expect it to be large, and
      # expect most of it not to be wanted.
      - name: Ask for the refreshed mirror to be merged into the UI branch
        if: steps.ff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: |
            Upstream `Dagherbou/OptiScaler_DLSSNR:dlss-neural-rendering` has new commits, and the
            mirror branch has been fast-forwarded (or merged) to carry them.

            Nothing has been pushed to the default branch. This pull request exists so someone
            decides what of it this fork actually wants.

            Two things to know before reading the diff:

            - The mirror and the UI branch diverged on purpose. The UI branch forked before
              upstream's DLSS-NR work landed and re-implemented it differently, so this diff
              includes a large body of commits that have deliberately never been on the default
              branch. Merging the whole thing is almost certainly the wrong move.
            - Cherry-pick what is wanted onto its own branch instead, and close this. It will be
              reopened the next time upstream moves.
        run: |
          EXISTING=$(gh pr list --base "$UI_BRANCH" --head "$MIRROR_BRANCH" --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING is already open for this; it now carries the refreshed mirror."
            exit 0
          fi

          gh pr create \
            --base "$UI_BRANCH" \
            --head "$MIRROR_BRANCH" \
            --title "Upstream has moved: review $MIRROR_BRANCH before it reaches $UI_BRANCH" \
            --body "$PR_BODY"
