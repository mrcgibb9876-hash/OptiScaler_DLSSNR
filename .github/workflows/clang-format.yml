name: clang-format Check
on: [push, pull_request]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clang-format style check for C/C++/Protobuf programs.
      uses: jidicula/clang-format-action@v4.15.0
      with:
        clang-format-version: '20'
        check-path: 'OptiScaler'
        # Three kinds of file are excluded, for one reason: nothing here writes them by hand, so
        # formatting them costs a conflict on every sync and buys nothing a reader will ever see.
        #
        #   precompile/ and dlssnr/opticalflow/shaders/ hold generated shader bytecode as C arrays
        #     (the latter open with `#if 0` and a disassembly listing). Upstream regenerates them
        #     unformatted, so a reformat touches every line and then loses to the next regeneration.
        #   dlssnr/opticalflow/fidelityfx/ is AMD's FidelityFX SDK, vendored verbatim. Reformatting
        #     30,000 lines of someone else's source guarantees a conflict on every upstream sync and
        #     makes the local copy harder to diff against theirs, which is the only thing it is for.
        #   DlssNr_I18n_Tables.cpp says so in its own first line: generated from the per-language
        #     lists, edit the lists and not the file.
        #
        # What is left is code this project actually writes, which is what a style check is for.
        # Before this the check failed on 96 files, 93% of them by line someone else's or a
        # generator's, so it was permanently red and told nobody anything.
        exclude-regex: 'external/|OptiScaler/include/|OptiScaler/shaders/dlssnr/precompile/|OptiScaler/dlssnr/opticalflow/fidelityfx/|OptiScaler/dlssnr/opticalflow/shaders/|OptiScaler/dlssnr/DlssNr_I18n_Tables\.cpp'
