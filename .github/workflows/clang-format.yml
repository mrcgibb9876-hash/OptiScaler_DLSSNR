name: clang-format Check
on: [push, pull_request]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clang-format style check for C/C++/Protobuf programs.
      uses: jidicula/clang-format-action@v4.15.0
      with:
        clang-format-version: '20'
        check-path: 'OptiScaler'
        # precompile/ holds generated shader bytecode as C arrays. Formatting it achieves nothing --
        # nobody reads it -- and it guarantees a conflict on every upstream sync, because upstream
        # regenerates those files unformatted and the reformat touches every line. Excluded so the
        # generated files can be taken from upstream verbatim.
        exclude-regex: 'external/|OptiScaler/include/|OptiScaler/shaders/dlssnr/precompile/'
